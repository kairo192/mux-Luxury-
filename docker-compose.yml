version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: luxe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luxe_ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-luxe_app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema_postgres.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks:
      - backend_net
    # Database is NEVER exposed directly to the public internet (no public ports mapping)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luxe_app_user} -d ${POSTGRES_DB:-luxe_ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luxe_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - luxe_uploads:/var/lib/luxe/uploads
      - luxe_backups:/var/lib/luxe/backups
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
      - frontend_net

  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    container_name: luxe_storefront
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - frontend_net

  nginx:
    image: nginx:1.27-alpine
    container_name: luxe_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
      - luxe_uploads:/var/lib/luxe/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - api
      - storefront
    networks:
      - frontend_net

networks:
  backend_net:
    internal: true
  frontend_net:
    driver: bridge

volumes:
  pgdata:
  luxe_uploads:
  luxe_backups:
