version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: luxe_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
      -c effective_cache_size=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luxe_ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-luxe_app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema_postgres.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Database is NEVER exposed directly to the public internet (no public ports mapping)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luxe_app_user} -d ${POSTGRES_DB:-luxe_ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luxe_api
    restart: unless-stopped
    env_file: .env
    environment:
      LUXE_DB_ENGINE: ${LUXE_DB_ENGINE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-luxe_app_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-luxe_ecommerce}}
      UPLOAD_DIR: /var/lib/luxe/uploads
      BACKUP_DIR: /var/lib/luxe/backups
      # SEO pages (/produit, /categorie) read the shop's index.html from here
      STOREFRONT_INTERNAL_URL: http://storefront
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - luxe_uploads:/var/lib/luxe/uploads
      - luxe_backups:/var/lib/luxe/backups
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
      - frontend_net

  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    container_name: luxe_storefront
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 32M
    mem_limit: 32m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api
    networks:
      - frontend_net

  nginx:
    image: nginx:1.27-alpine
    container_name: luxe_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    mem_limit: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
      - luxe_uploads:/var/lib/luxe/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - api
      - storefront
    networks:
      - frontend_net

networks:
  backend_net:
    internal: true
  frontend_net:
    driver: bridge

volumes:
  pgdata:
  luxe_uploads:
  luxe_backups:
