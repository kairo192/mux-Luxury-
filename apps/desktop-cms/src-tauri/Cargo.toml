[package]
name = "luxe-desktop-cms"
version = "1.0.0"
description = "Mus Luxury (LUXE) Desktop CMS Application (Tauri 2)"
authors = ["Mus Luxury Engineering"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
default = ["with-printers"]
# System printer discovery + raw write via CUPS / Windows Spooler.
# Disable this feature when cross-compiling on a host that lacks the native
# print backend; the hardware module still works against raw device paths
# (e.g. /dev/usb/lp0 or LPT1:) with the feature off.
with-printers = ["dep:printers"]

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-store = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-notification = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
printers = { version = "2", optional = true }
# rusqlite with the "bundled" feature embeds sqlite so no system library is
# required at install time — critical because boutique PCs don't have
# sqlite3-dev installed. Adds ~800 KB to the installer.
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3" }
