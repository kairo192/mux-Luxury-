[Interface]
Address = 10.8.0.1/24
ListenPort = 51820
PrivateKey = SERVER_PRIVATE_KEY_GENERATE_WITH_WG_GENKEY
SaveConfig = false

# Masquerade for internal routing
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# Peer: Windows Desktop CMS (Owner's PC)
[Peer]
PublicKey = CLIENT_PUBLIC_KEY_GENERATE_WITH_WG_PUBKEY
AllowedIPs = 10.8.0.2/32
