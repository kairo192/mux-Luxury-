events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # High-Performance HTTP Compression Engine
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Anti-Slowloris & Timeout Protection
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;
    client_max_body_size 6M;

    # Hide Nginx Version (Information Disclosure Prevention)
    server_tokens off;

    # Cryptographic TLS 1.3 & Modern Cipher Suites
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Mandatory Security Headers (OWASP Hardening)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # Content-Security-Policy: the storefront HTML uses inline <script>/<style>
    # and inline event handlers, so 'unsafe-inline' is required. Tailwind is
    # compiled at build time (no runtime CDN, no 'unsafe-eval').
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.mus-luxury.com https://mus-luxury.com https://api.musluxury.dz; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Anti-DDoS Rate Limiting Zones (Memory-backed sliding windows)
    limit_req_zone $binary_remote_addr zone=general_api:15m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=orders_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name mus-luxury.com www.mus-luxury.com api.mus-luxury.com musluxury.dz www.musluxury.dz api.musluxury.dz _;

        location = /api/v1/health {
            proxy_pass http://api:8000/api/v1/health;
            proxy_set_header Host $host;
        }

        location = /api/v1/ready {
            proxy_pass http://api:8000/api/v1/ready;
            proxy_set_header Host $host;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Dedicated API Subdomain: api.mus-luxury.com (and legacy api.musluxury.dz)
    server {
        listen 443 ssl http2;
        server_name api.mus-luxury.com api.musluxury.dz;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        limit_conn conn_limit_per_ip 25;

        # Authentication endpoints
        location /api/v1/admin/auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Order creation endpoints
        location = /api/v1/orders {
            limit_req zone=orders_limit burst=5 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # General REST API routing
        location / {
            limit_req zone=general_api burst=20 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Main Storefront & Consolidated Proxy: mus-luxury.com
    server {
        listen 443 ssl http2;
        server_name mus-luxury.com www.mus-luxury.com musluxury.dz www.musluxury.dz _;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Limit concurrent connections per IP
        limit_conn conn_limit_per_ip 25;

        # Authentication endpoints (Strict Brute-Force Rate Limiting)
        location /api/v1/admin/auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Order creation endpoints (Anti-Spam / Anti-Flood Rate Limiting)
        location = /api/v1/orders {
            limit_req zone=orders_limit burst=5 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # General REST API
        location /api/v1/ {
            limit_req zone=general_api burst=20 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Static uploaded media (Execution strictly disabled: no CGI/PHP; M-16 repeat security headers)
        location /uploads/ {
            alias /var/lib/luxe/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none';" always;
            # Block direct execution of scripts inside upload folder
            location ~* \.(php|py|pl|sh|cgi|exe|bat|js)$ {
                deny all;
            }
        }

        # Storefront static assets (Vite chunk hashed assets with immutable caching)
        location /assets/ {
            proxy_pass http://storefront:80;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        }

        # Public Storefront Web Application
        location / {
            proxy_pass http://storefront:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
