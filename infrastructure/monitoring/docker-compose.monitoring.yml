# -----------------------------------------------------------------------------
# Mus Luxury — monitoring stack (Uptime Kuma).
# Deployed SEPARATELY from the app stack so a broken app release never breaks
# the alerting, and vice-versa. Resource-tight — Uptime Kuma takes ~60 MB RAM.
#
# Usage on the VPS:
#   cd /opt/luxe/current/infrastructure/monitoring
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Expose via Nginx (not here) — Kuma listens on 127.0.0.1:3001 only.
# Configure monitors from the UI:
#   - HTTP(S) monitor: https://mus-luxury.com/                       (storefront)
#   - HTTP(S) monitor: https://api.mus-luxury.com/api/v1/health       (API)
#   - Push monitor:    "VPS metrics heartbeat" — vps-metrics.sh posts to it
#   - Keyword monitor: /api/v1/pos/compat        keyword: "supported"
#
# Alert channels: Telegram, email (SMTP) or WhatsApp (via n8n webhook).
# -----------------------------------------------------------------------------
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16-alpine
    container_name: luxe_uptime_kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  uptime-kuma-data:
