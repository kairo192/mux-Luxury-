# gitleaks configuration for Mus Luxury.
# Scans every commit on PRs for accidentally-committed secrets.

[extend]
useDefault = true

[allowlist]
description = "Known-safe placeholders, docs examples, and ephemeral CI secrets"
regexes = [
  '''<CHANGE_ME[^>]*>''',
  '''<mux-luxury@10000>''',
  '''<mux-luxry@2060>''',
  '''<editor@2050>''',
  '''ci_only_ephemeral_[A-Za-z0-9_]+''',
  '''test_only_ephemeral_[A-Za-z0-9_]+''',
  # Browser tests (e2e/): accounts that only exist in the throwaway test
  # database. Only these exact strings are exempt; the folder is still scanned.
  '''Proprio-E2E-2026!''',
  '''Caisse-E2E-2026!''',
]
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)infrastructure/environments/.*\.env\.example$''',
  '''(^|/)docs/''',
  '''(^|/)backend/tests/''',
  '''(^|/).github/workflows/ci\.yml$''',
  '''(^|/).gitleaks\.toml$''',
]
