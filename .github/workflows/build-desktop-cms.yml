# ============================================================================
# Mus Luxury — Desktop CMS (Tauri 2 / Windows) build & signed release.
#
# Two modes:
#   - workflow_dispatch / push to main      → unsigned build, uploaded as a
#                                             build artifact only. Used for
#                                             smoke testing.
#   - push of a tag matching v*             → full signed release: GitHub
#                                             release (archive) + published on
#                                             the shop server for auto-update.
#
# Update signing (Tauri updater, NOT the Windows publisher certificate):
#   public key  — committed: apps/desktop-cms/src-tauri/updater-key.pub, baked
#                 into EVERY build (LUXE_UPDATER_PUBKEY), so even a first,
#                 unsigned installer accepts the next signed update;
#   private key — secrets TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD). Without it a
#                 tag build is published unsigned and installed apps ignore it.
#
# Where installed apps get updates: https://api.mus-luxury.com/api/v1/admin/updates/cms/
# (latest.json + installer + .sig), for LOGGED-IN staff only: the API refuses
# any request without a valid CMS session, over HTTPS only. The publish-to-server
# job copies the files into the server folder the API reads, with the deploy SSH
# secrets (PRODUCTION_SSH_HOST / _USER / _PRIVATE_KEY). The GitHub repository
# is private, so its release files are kept as an archive only. Nothing is on
# the public website and there is no "download the CMS" link.
#
# Releasing an update = bump nothing, just push a tag:  git tag v1.0.1 && git push origin v1.0.1
# The app version is taken from the tag, the installer is signed, latest.json
# is generated, and every installed CMS picks it up within 4 hours (or at once
# via the version chip → "Rechercher une mise à jour").
# ============================================================================
name: Build Desktop CMS

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write    # needed to upload installer + latest.json to the tag's release

concurrency:
  group: build-desktop-cms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build & (if tag) sign Tauri 2 Windows installer
    runs-on: windows-latest
    env:
      # The installed CMS talks to the production server (also the built-in default).
      VITE_CMS_API_URL: https://api.mus-luxury.com/api/v1
    defaults:
      run:
        working-directory: ./apps/desktop-cms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop-cms/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable branch, 2026-11
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: "./apps/desktop-cms/src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci --audit=false --fund=false

      - name: Build React bundle
        run: npm run build

      - name: Decide whether to sign
        id: sign
        shell: bash
        run: |
          # The public key is in the repository: every build accepts signed updates.
          echo "LUXE_UPDATER_PUBKEY=$(tr -d '\r\n' < src-tauri/updater-key.pub)" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "::warning::Tag build without the TAURI_SIGNING_PRIVATE_KEY secret — producing an UNSIGNED build that installed apps will not accept as an update."
            fi
          fi

      - name: Build Tauri installer (unsigned)
        if: steps.sign.outputs.sign != 'true'
        run: npx tauri build
        shell: bash

      - name: Build Tauri installer (signed + updater artifacts)
        if: steps.sign.outputs.sign == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APP_VERSION: ${{ steps.sign.outputs.version }}
        run: |
          npx tauri build --config "{\"version\":\"${APP_VERSION}\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
        shell: bash

      - name: Generate updater manifest (latest.json)
        if: steps.sign.outputs.sign == 'true'
        run: |
          node scripts/make-latest-json.mjs \
            --version "${{ steps.sign.outputs.version }}" \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --base-url "https://api.mus-luxury.com/api/v1/admin/updates/cms"
        shell: bash

      - name: Upload unsigned build artifact
        if: steps.sign.outputs.sign != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mus-Luxury-Desktop-CMS-Windows-Unsigned-${{ github.sha }}
          path: |
            apps/desktop-cms/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop-cms/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the release files for the publish-to-server job
        if: steps.sign.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cms-release
          path: apps/desktop-cms/release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach installers + updater manifest to the GitHub release
        if: steps.sign.outputs.sign == 'true'
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2.0.8
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            apps/desktop-cms/release-assets/*
          fail_on_unmatched_files: true

  # Installed CMS apps read .../api/v1/admin/updates/cms/latest.json (staff login required).
  publish-to-server:
    name: Publish the signed update on mus-luxury.com
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    # One publication at a time (two tags must not interleave their uploads).
    concurrency:
      group: publish-desktop-cms-server
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check that the release was signed and the deploy SSH secrets exist
        id: ready
        env:
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
        run: |
          if [ -z "$SIGN_KEY" ]; then echo "::warning::unsigned release: nothing published for auto-update"; echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$HOST" ]; then echo "::warning::PRODUCTION_SSH_* secrets missing: update not published on the server"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout (for the shared downloads-folder helper)
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          name: desktop-cms-release
          path: release

      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd  # v0.9.0
        if: steps.ready.outputs.ok == 'true'
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

      - name: Upload the update (latest.json last)
        if: steps.ready.outputs.ok == 'true'
        env:
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
          INSTALL_ROOT: ${{ vars.PRODUCTION_INSTALL_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ROOT="${INSTALL_ROOT:-/opt/luxe}"
          # The SAME folder nginx serves: decided on the server by the function
          # release-deploy.sh uses (LUXE_DOWNLOADS_DIR from shared/.env, else
          # <install root>/shared/downloads).
          # shellcheck disable=SC2029  # the install root is passed on purpose
          DL=$(cat infrastructure/scripts/compose-project.sh infrastructure/scripts/downloads-dir.sh \
               | ssh "$USER@$HOST" bash -s -- "$ROOT")
          DEST="$DL/cms"
          # Installer and its signature first; the manifest that points at
          # them only once they are complete, so no app sees a half upload.
          scp release/*-setup.exe release/*-setup.exe.sig "$USER@$HOST:$DEST/"
          scp release/latest.json "$USER@$HOST:$DEST/latest.json.new"
          # Publish, then keep only the 3 newest versions (and remove any old public copy).
          # shellcheck disable=SC2029  # the folder is passed on purpose
          ssh "$USER@$HOST" bash -s -- "$DEST" <<'EOS'
          set -euo pipefail
          cd "$1"
          mv -f latest.json.new latest.json
          rm -f MusLuxuryCMS-setup.exe ./*.msi
          ls -1t MusLuxuryCMS_*-setup.exe | tail -n +4 | while read -r f; do rm -f "$f" "$f.sig"; done
          EOS
          # Without a login the API must refuse the files (401): they are for staff only.
          # The server deploy (cd-production.yml, same tag) may still be running, so
          # wait up to 10 minutes for the update address; anything else fails the job.
          url=https://api.mus-luxury.com/api/v1/admin/updates/cms/latest.json
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            case "$code" in
              401) echo "Published; the update files are refused without a staff login (401), as intended."; exit 0 ;;
              2*) echo "::error::The update files are readable WITHOUT a login (HTTP $code)."; exit 1 ;;
            esac
            echo "Update address answered HTTP $code; waiting for the server deploy..."
            sleep 30
          done
          echo "::error::The update address never answered 401 (last: HTTP $code). The files are on the server, but"
          echo "::error::installed apps cannot reach them until the server runs this version: deploy it, then re-run this job."
          exit 1
