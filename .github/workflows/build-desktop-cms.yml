# ============================================================================
# Mus Luxury — Desktop CMS (Tauri 2 / Windows) build & signed release.
#
# Two modes:
#   - workflow_dispatch / push to main      → unsigned build, uploaded as a
#                                             build artifact only. Used for
#                                             smoke testing.
#   - push of a tag matching v*             → full signed release, published
#                                             to the matching GitHub release
#                                             with latest.json for the Tauri
#                                             Updater.
#
# Secrets required for signed releases (Settings → Secrets → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           — content of ~/.tauri/mux_luxury.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — password used during `tauri signer generate`
# Variable (Settings → Secrets and variables → Actions → Variables):
#   TAURI_UPDATER_PUBKEY                — content of ~/.tauri/mux_luxury.key.pub
#
# The public key is baked into the app at compile time (LUXE_UPDATER_PUBKEY,
# read by src-tauri/src/app_services.rs). Builds without it simply have the
# updater switched off — they never crash. Only the matching public key
# accepts updates; rotating it forces a reinstall, which is exactly the safety
# net you want if a signing key leaks.
#
# Releasing an update = bump nothing, just push a tag:  git tag v1.0.1 && git push origin v1.0.1
# The app version is taken from the tag, the installer is signed, latest.json
# is generated, and every installed CMS picks it up within 4 hours (or at once
# via the version chip → "Rechercher une mise à jour").
# ============================================================================
name: Build Desktop CMS

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write    # needed to upload installer + latest.json to the tag's release

concurrency:
  group: build-desktop-cms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build & (if tag) sign Tauri 2 Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./apps/desktop-cms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop-cms/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17  # stable, 2024-07
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2d8d7db7d52bbe4  # v2.7.5
        with:
          workspaces: "./apps/desktop-cms/src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci --audit=false --fund=false

      - name: Build React bundle
        run: npm run build

      - name: Decide whether to sign
        id: sign
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ] && [ -n "${{ vars.TAURI_UPDATER_PUBKEY }}" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "::warning::Tag build without TAURI_SIGNING_PRIVATE_KEY secret or TAURI_UPDATER_PUBKEY variable — producing an UNSIGNED build with auto-update disabled."
            fi
          fi

      - name: Build Tauri installer (unsigned)
        if: steps.sign.outputs.sign != 'true'
        run: npx tauri build
        shell: bash

      - name: Build Tauri installer (signed + updater artifacts)
        if: steps.sign.outputs.sign == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUXE_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          APP_VERSION: ${{ steps.sign.outputs.version }}
        run: |
          npx tauri build --config "{\"version\":\"${APP_VERSION}\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
        shell: bash

      - name: Generate updater manifest (latest.json)
        if: steps.sign.outputs.sign == 'true'
        run: |
          node scripts/make-latest-json.mjs \
            --version "${{ steps.sign.outputs.version }}" \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}"
        shell: bash

      - name: Upload unsigned build artifact
        if: steps.sign.outputs.sign != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mus-Luxury-Desktop-CMS-Windows-Unsigned-${{ github.sha }}
          path: |
            apps/desktop-cms/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop-cms/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Attach installers + updater manifest to the GitHub release
        if: steps.sign.outputs.sign == 'true'
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2.0.8
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            apps/desktop-cms/release-assets/*
          fail_on_unmatched_files: true
