# ============================================================================
# Mus Luxury — Continuous Integration
# ----------------------------------------------------------------------------
# Runs on every pull request to main and on pushes to main / feat/*. Builds
# frontends, tests backend against SQLite AND a real PostgreSQL 16 service,
# validates migrations, static-analyses code, and audits dependencies for
# known CVEs.
#
# No step here deploys anything. Deploys happen only from cd-staging.yml and
# cd-production.yml, and both require this workflow green on the same commit.
#
# Action pinning: actions/* are GitHub-owned and tracked by major version tag.
# Third-party actions are pinned to full-length commit SHAs with the matching
# version tag in a comment (bump via Dependabot in .github/dependabot.yml).
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ 1. Lockfiles
  lockfiles:
    name: Validate lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Storefront npm ci (deterministic install)
        working-directory: ./apps/storefront
        run: npm ci --audit=false --fund=false
      - name: Desktop CMS npm ci (deterministic install)
        working-directory: ./apps/desktop-cms
        run: npm ci --audit=false --fund=false

  # ------------------------------------------------------------------ 2. Lint & static analysis
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install --no-cache-dir ruff==0.6.9
      - name: ruff check (errors only; warnings are informational)
        run: ruff check backend --output-format=github --exit-non-zero-on-fix
      - name: ruff format --check
        run: ruff format --check backend || echo "::warning ::formatting drift — not blocking"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Storefront tsc --noEmit
        working-directory: ./apps/storefront
        run: |
          npm ci --audit=false --fund=false
          npx tsc --noEmit
      - name: Desktop CMS tsc --noEmit
        working-directory: ./apps/desktop-cms
        run: |
          npm ci --audit=false --fund=false
          npx tsc --noEmit

      - name: Shell scripts syntax check
        run: |
          find infrastructure -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n
          find backend/scripts -type f -name '*.sh' -print0 2>/dev/null \
            | xargs -0 -r -n1 bash -n

      - name: Shell scripts lint (shellcheck, warnings and errors)
        # Preinstalled on GitHub's Ubuntu runners; deploy, backup and
        # certificate scripts run as root on the VPS.
        run: find infrastructure -type f -name '*.sh' -print0 | xargs -0 shellcheck -S warning

      - name: Lint GitHub workflows (actionlint)
        # The official actionlint image, pinned. (The raven-actions wrapper broke:
        # it installs @actions/tool-cache into the workspace, whose newest
        # version cannot be require()d — the step failed before linting.)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
          -color -ignore 'SC2006' -ignore 'SC2086'

  # ------------------------------------------------------------------ 3. Migration safety
  migrations-validate:
    name: Migrations — static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: ./backend
        run: pip install --no-cache-dir -r requirements.txt
      - name: Validate migrations (forbids destructive ops)
        working-directory: ./backend
        env:
          LUXE_DB_ENGINE: sqlite
          LUXE_SQLITE_PATH: /tmp/ci_validate.sqlite3
          SECRET_KEY: ci_only_ephemeral_secret_for_migration_validation_abcdef0123456789abcd
        run: |
          python -m app.migration_runner validate
          rm -f "$LUXE_SQLITE_PATH"
          python -m app.migration_runner dry-run

  # ------------------------------------------------------------------ 4. Backend tests on SQLite (fast)
  backend-tests-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    needs: [lockfiles]
    env:
      APP_ENV: test
      LUXE_DB_ENGINE: sqlite
      LUXE_SQLITE_PATH: /tmp/ci_sqlite.sqlite3
      SECRET_KEY: ci_only_ephemeral_secret_sqlite_abcdef0123456789abcdef0123456789abcd
      CMS_HMAC_SIGNING_SECRET: ci_only_ephemeral_hmac_sqlite_abcdef0123456789abcdef0123456789abc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Node.js & @babel/core (via apt node-babel7) for TSX AST tests
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs node-babel7
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Run migration up (SQLite)
        working-directory: ./backend
        run: python -m app.migration_runner up
      - name: Run full test suite
        working-directory: ./backend
        run: python -m unittest discover -s tests -v

  # ------------------------------------------------------------------ 5. Backend integration tests on PostgreSQL 16
  backend-tests-postgres:
    name: Backend integration tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: [lockfiles]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luxe_ci
          POSTGRES_USER: luxe_ci_user
          POSTGRES_PASSWORD: luxe_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U luxe_ci_user -d luxe_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      LUXE_DB_ENGINE: postgres
      DATABASE_URL: postgresql://luxe_ci_user:luxe_ci_password@localhost:5432/luxe_ci
      SECRET_KEY: ci_only_ephemeral_secret_pg_abcdef0123456789abcdef0123456789abcdef01
      CMS_HMAC_SIGNING_SECRET: ci_only_ephemeral_hmac_pg_abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Node.js & @babel/core (via apt node-babel7) for TSX AST tests
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs node-babel7 postgresql-client
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Load initial schema
        env:
          PGPASSWORD: luxe_ci_password
        run: |
          psql -h localhost -U luxe_ci_user -d luxe_ci \
            -f backend/migrations/001_initial_schema_postgres.sql
      - name: Run versioned migrations
        working-directory: ./backend
        run: python -m app.migration_runner up
      - name: Run backend tests
        working-directory: ./backend
        run: python -m unittest discover -s tests -v

  # ------------------------------------------------------------------ 6. Frontend builds
  build-storefront:
    name: Build storefront (Vite)
    runs-on: ubuntu-latest
    needs: [lockfiles]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/storefront/package-lock.json
      - working-directory: ./apps/storefront
        run: |
          npm ci --audit=false --fund=false
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-dist-${{ github.sha }}
          path: apps/storefront/dist
          retention-days: 7

  build-cms:
    name: Build desktop CMS frontend bundle
    runs-on: ubuntu-latest
    needs: [lockfiles]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop-cms/package-lock.json
      - working-directory: ./apps/desktop-cms
        run: |
          npm ci --audit=false --fund=false
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-cms-dist-${{ github.sha }}
          path: apps/desktop-cms/dist
          retention-days: 7

  # ------------------------------------------------------------------ 6b. End-to-end: shop + CMS in a real browser
  # A fresh production-mode API on an empty PostgreSQL database, the CMS and
  # the shop dev servers; e2e/tests walk a first installation, the catalogue,
  # the shop checkout, daily operations, finance and every CMS screen in
  # 3 languages for 2 roles.
  e2e:
    name: End-to-end (shop + CMS, PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: [lockfiles]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luxe_e2e
          POSTGRES_USER: luxe_e2e_user
          POSTGRES_PASSWORD: luxe_e2e_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U luxe_e2e_user -d luxe_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://luxe_e2e_user:luxe_e2e_password@localhost:5432/luxe_e2e
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/storefront/package-lock.json
            apps/desktop-cms/package-lock.json
            e2e/package-lock.json
      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Install shop, CMS and test dependencies
        run: |
          npm ci --prefix apps/storefront --audit=false --fund=false
          npm ci --prefix apps/desktop-cms --audit=false --fund=false
          npm ci --prefix e2e --audit=false --fund=false
      - name: Cache the browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install the browser
        working-directory: ./e2e
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run end-to-end tests
        working-directory: ./e2e
        run: npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # ------------------------------------------------------------------ 7. Backend image build (smoke only; not pushed)
  build-backend-image:
    name: Build backend image (smoke)
    runs-on: ubuntu-latest
    needs: [backend-tests-sqlite]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1
      - name: Build (no push)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75  # v6.9.0
        with:
          context: ./backend
          push: false
          load: true
          tags: luxe-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts and its libraries load (no compiler in the image)
        run: |
          docker run --rm luxe-backend:ci-${{ github.sha }} python -c "import psycopg, PIL.Image, cryptography, fastapi, uvicorn; print('libpq', psycopg.pq.version())"

  # ------------------------------------------------------------------ 8. Dependency vulnerability audit
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans every commit of a push (first^..last): it needs the
          # history, not only the newest commit (default depth 1).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (fails only on HIGH or CRITICAL CVEs)
        run: |
          pip install --no-cache-dir pip-audit==2.7.3
          pip-audit --requirement backend/requirements.txt \
                    --strict \
                    --vulnerability-service osv \
                    --ignore-vuln GHSA-j8r2-6x86-q33q \
                    --format=columns || AUDIT_FAILED=$?
          # Re-run excluding LOW/MEDIUM: the pipeline fails only on HIGH+.
          # pip-audit itself has no severity filter; use osv-scanner for that.
          if [ "${AUDIT_FAILED:-0}" -ne 0 ]; then
            echo "::warning ::pip-audit found vulnerabilities — see log; failing pipeline only on HIGH/CRITICAL"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (storefront) — HIGH+
        working-directory: ./apps/storefront
        run: |
          npm ci --audit=false --fund=false
          npm audit --audit-level=high || exit 1
      - name: npm audit (desktop-cms) — HIGH+
        working-directory: ./apps/desktop-cms
        run: |
          npm ci --audit=false --fund=false
          npm audit --audit-level=high || exit 1

      - name: Secret scan with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE needed for public repos; private orgs need one.
        with:
          config-path: .gitleaks.toml

  # ------------------------------------------------------------------ 9. Gate — all required jobs must pass
  ci-complete:
    name: CI complete (branch-protection gate)
    runs-on: ubuntu-latest
    needs:
      - lockfiles
      - lint
      - migrations-validate
      - backend-tests-sqlite
      - backend-tests-postgres
      - build-storefront
      - build-cms
      - e2e
      - build-backend-image
      - dependency-audit
    if: always()
    steps:
      - name: Fail if any dependency did not succeed
        run: |
          if [ "${{ needs.lockfiles.result }}"            != "success" ] \
          || [ "${{ needs.lint.result }}"                 != "success" ] \
          || [ "${{ needs.migrations-validate.result }}"  != "success" ] \
          || [ "${{ needs.backend-tests-sqlite.result }}" != "success" ] \
          || [ "${{ needs.backend-tests-postgres.result }}" != "success" ] \
          || [ "${{ needs.build-storefront.result }}"     != "success" ] \
          || [ "${{ needs.build-cms.result }}"            != "success" ] \
          || [ "${{ needs.e2e.result }}"                  != "success" ] \
          || [ "${{ needs.build-backend-image.result }}"  != "success" ] \
          || [ "${{ needs.dependency-audit.result }}"     != "success" ]; then
            echo "One or more required CI jobs failed." >&2
            exit 1
          fi
          echo "All required CI jobs succeeded."
