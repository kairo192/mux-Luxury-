name: LUXE E-Commerce CI Pipeline

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests-and-security:
    name: FastAPI Backend & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js & Babel AST Toolchain for TSX Verification Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs node-babel7
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run automated API, Dynamic Category, Variant & Security Test Suite
        working-directory: ./backend
        run: |
          python3 -m unittest discover -s tests -v

  storefront-check:
    name: React + TypeScript Storefront & Desktop CMS Bundle Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Public Storefront (Vite + TypeScript)
        working-directory: ./apps/storefront
        run: |
          npm install
          npm run build
      - name: Build Desktop CMS Frontend Bundle (Vite + TypeScript)
        working-directory: ./apps/desktop-cms
        run: |
          npm install
          npm run build
