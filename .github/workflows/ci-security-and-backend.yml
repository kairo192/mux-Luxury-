name: CI — Backend, Security & Storefront Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-platform:
    name: FastAPI Security Suite, Schema Parity & Infrastructure Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Validate Infrastructure & Backup Shell Scripts
        run: |
          bash -n infrastructure/backups/backup_postgres_and_media.sh
          bash -n infrastructure/backups/restore_backup.sh
          bash -n infrastructure/scripts/deploy_algeria_vps.sh

      - name: Run Full Backend, Security & Architecture Test Suite
        working-directory: ./backend
        run: python3 -m unittest discover -s tests -v
